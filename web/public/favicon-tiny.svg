<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Flat, high-contrast variant of fire-icon.svg for the smallest favicon frames (16x16).
     The soft radial ember glow reads well at app-icon sizes but turns into a muddy haze
     at 16px, so it is omitted here; the gradient ember center and cream glyph stay crisp. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F97316" />
      <stop offset="0.55" stop-color="#FBBF24" />
      <stop offset="1" stop-color="#FDE68A" />
    </linearGradient>
  </defs>
  <rect width="456" height="456" fill="#17352C" />
  <rect x="233.6" y="206" width="52" height="52" transform="skewX(-5.81)" fill="url(#ember)" />
  <g fill="none" stroke="#FFF3D6" stroke-width="40" stroke-linecap="round">
    <path d="M118 186H338" />
    <path d="M118 278H338" />
    <path d="M201 124L179 340" />
    <path d="M293 124L271 340" />
  </g>
</svg>
