name: Build and Package Mac Catalyst

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build and sign a release PKG'
        required: false
        default: false
        type: boolean
      upload_testflight:
        description: 'Upload the signed PKG to TestFlight'
        required: false
        default: false
        type: boolean
      base_version:
        description: 'Application display version (for example, 1.0.0)'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: maui-maccatalyst-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-maccatalyst:
    name: Required / Mac Catalyst
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      PROJECT_PATH: app/MyFireNumber/MyFireNumber.csproj
      TEST_PROJECT: app/MyFireNumber.Tests/MyFireNumber.Tests.csproj
      TARGET_FRAMEWORK: net10.0-maccatalyst
      APPLE_DOTNET_VERSION: '10.0.402'
      APPLE_WORKLOAD_VERSION: '10.0.402.1'
      APPLE_XCODE_VERSION: '27.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Mac Catalyst changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            maccatalyst:
              - 'app/**'
              - 'MyFireNumber.slnx'
              - '.github/workflows/maui-maccatalyst.yml'

      - name: Validate workflow inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight && !inputs.build_release }}
        run: |
          echo "build_release must be enabled when upload_testflight is enabled" >&2
          exit 1

      - name: Select Xcode
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.maccatalyst == 'true' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.APPLE_XCODE_VERSION }}

      - name: Setup .NET SDK
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.maccatalyst == 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.APPLE_DOTNET_VERSION }}

      - name: Select pinned Apple SDK
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.maccatalyst == 'true' }}
        run: |
          cat > global.json <<EOF
          {
            "sdk": {
              "version": "$APPLE_DOTNET_VERSION",
              "rollForward": "disable",
              "allowPrerelease": false,
              "workloadVersion": "$APPLE_WORKLOAD_VERSION"
            }
          }
          EOF
          test "$(dotnet --version)" = "$APPLE_DOTNET_VERSION"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Restore .NET workloads
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.maccatalyst == 'true' }}
        run: |
          dotnet workload restore "${{ env.PROJECT_PATH }}"
          test "$(dotnet workload --version)" = "$APPLE_WORKLOAD_VERSION"
          dotnet workload list

      - name: Restore
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.maccatalyst == 'true' }}
        run: dotnet restore "${{ env.PROJECT_PATH }}" -p:TargetFramework="${{ env.TARGET_FRAMEWORK }}"

      - name: Test calculation, storage, and export layers
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.maccatalyst == 'true' }}
        run: dotnet test "${{ env.TEST_PROJECT }}" -c Release

      - name: Build Mac Catalyst apps (ARM64 and x64)
        if: ${{ (github.event_name != 'pull_request' || steps.changes.outputs.maccatalyst == 'true') && (github.event_name == 'pull_request' || !inputs.build_release) }}
        run: |
          for runtime in maccatalyst-arm64 maccatalyst-x64; do
            dotnet build "$PROJECT_PATH" \
              -c Debug \
              -f "$TARGET_FRAMEWORK" \
              -p:RuntimeIdentifier="$runtime"
          done

      - name: No relevant changes
        if: ${{ github.event_name == 'pull_request' && steps.changes.outputs.maccatalyst != 'true' }}
        run: echo "No relevant Mac Catalyst changes; check passed."

      - name: Compute release version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        id: version
        env:
          BASE_VERSION: ${{ inputs.base_version }}
        run: |
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "base_version must be a valid version such as 1.0.0" >&2
            exit 1
          fi

          echo "display-version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "app-version=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Validate release secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_MACCATALYST_APPSTORE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MACCATALYST_APPSTORE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_MACCATALYST_APPSTORE_PROFILE }}
          ISSUER_ID: ${{ secrets.APPLE_REFRACTORED_ISSUER_ID }}
          API_KEY_ID: ${{ secrets.APPLE_REFRACTORED_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_REFRACTORED_P8_KEY }}
          UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$PROVISIONING_PROFILE" ]; then
            echo "Mac Catalyst certificate, password, and provisioning profile secrets are required" >&2
            exit 1
          fi

          if [ "$UPLOAD_TESTFLIGHT" = "true" ] && { [ -z "$ISSUER_ID" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_PRIVATE_KEY" ]; }; then
            echo "App Store Connect API secrets are required to upload to TestFlight" >&2
            exit 1
          fi

      - name: Import Mac Catalyst signing certificates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          create-keychain: true
          keychain-password: ${{ secrets.APPLE_MACCATALYST_APPSTORE_CERTIFICATE_PASSWORD }}
          p12-file-base64: ${{ secrets.APPLE_MACCATALYST_APPSTORE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_MACCATALYST_APPSTORE_CERTIFICATE_PASSWORD }}

      - name: Locate signing identities
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        id: signing
        run: |
          keychain="$HOME/Library/Keychains/signing_temp.keychain-db"

          codesign_key=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Apple Distribution: [^"]*\)".*/\1/p' |
            head -1)
          # macOS sed has no \| alternation in basic regex, so this needs -E.
          package_signing_key=$(security find-identity -v -p basic "$keychain" |
            sed -En 's/.*"((3rd Party Mac Developer Installer|Mac Installer Distribution): [^"]*)".*/\1/p' |
            head -1)

          if [ -z "$codesign_key" ]; then
            echo "The P12 does not contain an Apple Distribution certificate and private key" >&2
            exit 1
          fi

          if [ -z "$package_signing_key" ]; then
            echo "The P12 does not contain a Mac Installer Distribution certificate and private key" >&2
            exit 1
          fi

          echo "codesign-key=$codesign_key" >> "$GITHUB_OUTPUT"
          echo "package-signing-key=$package_signing_key" >> "$GITHUB_OUTPUT"

      - name: Install Mac Catalyst provisioning profile
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        id: provisioning-profile
        env:
          MACCATALYST_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_MACCATALYST_APPSTORE_PROFILE }}
        run: |
          profile_path="${{ runner.temp }}/myfirenumber.provisionprofile"
          profile_plist="${{ runner.temp }}/myfirenumber-profile.plist"
          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$MACCATALYST_APPSTORE_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")

          mkdir -p "$profiles_directory"
          cp "$profile_path" "$profiles_directory/$profile_uuid.provisionprofile"
          echo "uuid=$profile_uuid" >> "$GITHUB_OUTPUT"

      - name: Publish signed Mac Catalyst package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        env:
          CODESIGN_KEY: ${{ steps.signing.outputs.codesign-key }}
          PACKAGE_SIGNING_KEY: ${{ steps.signing.outputs.package-signing-key }}
        run: |
          # Store-signed builds carry restricted entitlements, so macOS treats the process as
          # restricted. Unless the app is also signed with the hardened runtime, dyld then refuses
          # to expand @rpath and the app aborts at launch before it can load the SkiaSharp,
          # HarfBuzzSharp, and SQLite native libraries.
          dotnet publish "${{ env.PROJECT_PATH }}" \
            -c Release \
            -f "${{ env.TARGET_FRAMEWORK }}" \
            -p:RuntimeIdentifiers=maccatalyst-arm64%3Bmaccatalyst-x64 \
            -p:MtouchLink=SdkOnly \
            -p:CreatePackage=true \
            -p:EnableCodeSigning=true \
            -p:EnablePackageSigning=true \
            -p:UseHardenedRuntime=true \
            -p:ApplicationDisplayVersion="${{ steps.version.outputs.display-version }}" \
            -p:ApplicationVersion="${{ steps.version.outputs.app-version }}" \
            -p:CodesignKey="$CODESIGN_KEY" \
            -p:CodesignProvision="${{ steps.provisioning-profile.outputs.uuid }}" \
            -p:CodesignEntitlements="Platforms/MacCatalyst/Entitlements.plist" \
            -p:PackageSigningKey="$PACKAGE_SIGNING_KEY"

      - name: Verify Mac Catalyst app bundles
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.maccatalyst == 'true' }}
        env:
          BUILD_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display-version }}
          BUILD_NUMBER: ${{ steps.version.outputs.app-version }}
        run: |
          output_directories=(
            "app/MyFireNumber/bin/Debug/$TARGET_FRAMEWORK/maccatalyst-arm64"
            "app/MyFireNumber/bin/Debug/$TARGET_FRAMEWORK/maccatalyst-x64"
          )
          if [ "$BUILD_RELEASE" = "true" ]; then
            output_directories=("app/MyFireNumber/bin/Release/$TARGET_FRAMEWORK")
          fi

          for output_directory in "${output_directories[@]}"; do
            app_bundle=$(find "$output_directory" -maxdepth 1 -name '*.app' -type d -print -quit)
            if [ -z "$app_bundle" ]; then
              echo "Mac Catalyst app bundle was not produced in $output_directory" >&2
              exit 1
            fi
            plist="$app_bundle/Contents/Info.plist"
            plutil -lint "$plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes' "$plist")" = "false"
            test "$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneConfigurationName' "$plist")" = "__MAUI_DEFAULT_SCENE_CONFIGURATION__"
            test "$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' "$plist")" = "SceneDelegate"
            if [ "$BUILD_RELEASE" = "true" ]; then
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$DISPLAY_VERSION"
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD_NUMBER"
              executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
              lipo -verify_arch arm64 x86_64 "$app_bundle/Contents/MacOS/$executable"
            fi
          done

      - name: Locate Mac Catalyst package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        id: maccatalyst-artifact
        run: |
          artifact_path=$(find "app/MyFireNumber/bin/Release/${{ env.TARGET_FRAMEWORK }}/publish" -maxdepth 1 -name '*.pkg' -print -quit)
          if [ -z "$artifact_path" ]; then
            echo "Signed Mac Catalyst package was not produced" >&2
            exit 1
          fi

          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release && inputs.upload_testflight }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-type: macos
          app-path: ${{ steps.maccatalyst-artifact.outputs.path }}
          backend: altool
          issuer-id: ${{ secrets.APPLE_REFRACTORED_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_REFRACTORED_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_REFRACTORED_P8_KEY }}

      - name: Upload Mac Catalyst package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
        uses: actions/upload-artifact@v7
        with:
          name: myfirenumber-maccatalyst-pkg
          path: ${{ steps.maccatalyst-artifact.outputs.path }}
          if-no-files-found: error
