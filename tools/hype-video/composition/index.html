<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Fire # — hype video</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../node_modules/@fontsource/inter/500.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/inter/700.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/inter/800.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/inter/900.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="viewport">
      <div id="stage">
        <canvas id="background" width="1920" height="1080"></canvas>
        <div id="scenes"></div>
        <div id="flash"></div>
        <div id="vignette"></div>
        <div id="fade"></div>
      </div>
    </div>
    <div id="controls" hidden>
      <button id="play" type="button">Play</button>
      <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Timeline" />
      <output id="time">0.00s</output>
      <audio id="music" preload="auto"></audio>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
